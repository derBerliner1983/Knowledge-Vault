<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zweites Gehirn — Graph</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ff9a1f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="graph"></canvas>

  <header id="topbar">
    <div id="brand">
      <span class="dot"></span>
      <h1>Zweites&nbsp;<em>Gehirn</em></h1>
      <span id="stats"></span>
    </div>
    <div id="controls">
      <input id="search" type="search" placeholder="Suchen … (Titel, Tag, Pfad)" autocomplete="off">
      <button id="reindex" title="Vault neu einlesen">⟳ Neu indexieren</button>
      <button id="automat-btn" title="Regeln, Aufträge und LLM-Status">⚙ Automat</button>
    </div>
  </header>

  <div id="automat" class="hidden">
    <div id="automat-card">
      <button id="automat-close" title="Schließen">×</button>
      <h2>⚙ Der Automat</h2>

      <section>
        <h3>Lokales LLM</h3>
        <div id="llm-status">Prüfe …</div>
      </section>

      <section>
        <h3>Auftrag an das LLM</h3>
        <textarea id="auftrag-text" rows="3"
          placeholder="z. B.: Leere die Inbox und sortiere die Notizen nach den Regeln in die passenden Ordner ein."></textarea>
        <div class="reihe">
          <select id="modell-wahl" title="Modell für diesen Auftrag"></select>
          <button id="auftrag-plan">Nur Plan zeigen</button>
          <button id="auftrag-los" class="primaer">Planen &amp; ausführen</button>
        </div>
        <div id="auftrag-ergebnis"></div>
      </section>

      <section>
        <h3>Regeln (Crontab — <code>_system/regeln.json</code>)</h3>
        <div id="regeln"></div>
      </section>

      <section>
        <h3>Protokoll</h3>
        <pre id="automat-log">—</pre>
      </section>
    </div>
  </div>

  <div id="side">
    <nav id="views">
      <h3>Ansichten</h3>
      <button data-mode="wolken" class="active">☁ Wolken</button>
      <button data-mode="sphaere">◍ Sphäre</button>
      <button data-mode="saeulen">▥ Säulen</button>
      <button data-mode="radial">✳ Radial</button>
      <button data-mode="nebel">✦ Nebel</button>
      <p id="view-hint"></p>
    </nav>

    <aside id="panel" class="hidden">
      <button id="panel-close" title="Schließen">×</button>
      <h2 id="panel-title"></h2>
      <p id="panel-path"></p>
      <div id="panel-tags"></div>
      <div id="panel-neighbors"></div>
      <a id="panel-open" class="button" href="#">In Obsidian öffnen</a>
    </aside>
  </div>

  <aside id="legend"></aside>

  <script src="vendor/d3.v7.min.js"></script>
  <script src="app.js"></script>
  <script src="automat-ui.js"></script>
</body>
</html>
